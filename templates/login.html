<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión - Servicio de Contenedores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background-color: #4a121a; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Source Sans 3', sans-serif; }
    .card-auth { border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
    .btn-primary { background-color: #4a121a; border-color: #4a121a; }
    .btn-primary:hover { background-color: #c23b32; border-color: #c23b32; }
  </style>
</head>
<body>
  <div class="container" style="max-width: 420px;">
    <div class="card card-auth p-4 bg-white">
      <div class="text-center mb-4">
        <h2 class="fw-bold h4" style="color: #4a121a;">Servicio de Contenedores</h2>
        <p class="text-muted small">Ingresa al panel de gestión</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold small">Correo Electrónico:</label>
          <input type="email" name="email" class="form-control" placeholder="admin@serviciosmaipu.com" required />
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Contraseña:</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Iniciar Sesión</button>
      </form>
      <div class="text-center mt-3">
        <small class="text-muted">¿No tienes una cuenta? <a href="{{ url_for('registro') }}" class="text-danger fw-bold text-decoration-none">Regístrate aquí</a></small>
      </div>
    </div>
  </div>
</body>
</html>
